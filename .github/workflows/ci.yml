name: Online trading CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Optional offline artifact version, for example v1.0.0'
        required: false
        type: string
jobs:
  online:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libgtest-dev libyaml-cpp-dev pkg-config ripgrep jq
      - name: Install fixed strategy artifact
        env:
          PACKAGE_URL: ${{ vars.QUANT_STRATEGIES_ARCHIVE_URL }}
        run: |
          test -n "$PACKAGE_URL"
          curl --fail --location "$PACKAGE_URL" --output /tmp/strategies.tar.gz
          expected=$(jq -r .archive_sha256 dependencies.lock.json)
          echo "$expected  /tmp/strategies.tar.gz" | sha256sum -c -
          mkdir -p /tmp/quant-strategies
          tar -xzf /tmp/strategies.tar.gz -C /tmp/quant-strategies
      - run: cmake -S . -B build -DQUANT_HFT_BUILD_TESTS=ON -DCMAKE_PREFIX_PATH=/tmp/quant-strategies
      - run: cmake --build build -j2
      - run: ctest --test-dir build --no-tests=error --output-on-failure --output-junit online-tests.xml
      - run: bash scripts/build/dependency_audit.sh --build-dir build
      - run: bash scripts/build/repo_purity_check.sh --repo-root .
      - run: bash scripts/build/doc_purity_check.sh --repo-root .
      - run: bash scripts/build/three_project_boundary_check.sh --repo-root . --build-dir build
      - name: Package tested offline host
        if: github.event_name == 'workflow_dispatch' && inputs.package_version != ''
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: bash scripts/build/package_nonhotpath_release.sh "$PACKAGE_VERSION" dist build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.package_version != ''
        with:
          name: online-offline-release
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-offline-validation
          path: online-tests.xml
