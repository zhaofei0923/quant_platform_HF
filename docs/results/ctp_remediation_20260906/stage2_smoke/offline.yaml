ctp:
  profile: "offline_smoke"
  environment: sim
  run_type: sim
  is_production_mode: false
  enable_real_api: false
  broker_id: "TEST_BROKER"
  user_id: "TEST_ACCOUNT"
  investor_id: "TEST_ACCOUNT"
  account_id: "TEST_ACCOUNT"
  password: "TEST_ONLY"
  market_front: "tcp://sim-md"
  trader_front: "tcp://sim-td"
  auth_code: "TEST_ONLY"
  app_id: "TEST_ONLY"
  metrics_enabled: false
  log_level: "info"
  log_sink: "stderr"
  instruments: "rb2701"
  strategy_ids: "offline_smoke"
  strategy_factory: "demo"
  strategy_state_persist_enabled: true
  strategy_state_backend: "file"
  strategy_state_snapshot_interval_ms: 1000
  strategy_state_file_dir: "/tmp/quant-hft-stage2-smoke/state"
  market_data_recording_enabled: true
  market_data_recording_dir: "/tmp/quant-hft-stage2-smoke/market"
  market_data_recording_flush_each_write: true
  flow_path: "/tmp/quant-hft-stage2-smoke/flow"
  settlement_confirm_required: true
  query_rate_per_sec: 50
  query_rate_limit_qps: 50
  query_bucket_capacity: 50
  account_query_interval_ms: 1000
  position_query_interval_ms: 1000
  instrument_query_interval_ms: 2000
  recovery_query_timeout_ms: 2000
  recovery_quiet_period_ms: 0
  open_reenable_stability_ms: 1000
  market_bar_poll_interval_ms: 100
  market_bar_checkpoint_interval_ms: 500
  execution_mode: "direct"
  execution_algo: "direct"
  execution_price_mode: "signal_limit"
  cancel_after_ms: 0
